name: Go SDK - Build & Test

on:
  push:
    branches: [ master, develop ]
    paths:
      - 'sdks/go/**'
      - '.github/workflows/go-sdk.yml'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'sdks/go/**'
      - '.github/workflows/go-sdk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go: [ '1.24', 'stable' ]

    defaults:
      run:
        working-directory: sdks/go/milvaion

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: sdks/go/milvaion/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build example
        run: go build ./examples/...
