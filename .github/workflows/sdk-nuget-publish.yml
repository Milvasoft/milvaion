      - name: Restore Milvasoft.Milvaion.Sdk.Worker.Quartz dependencies
        run: dotnet restore src/Sdk/Milvasoft.Milvaion.Sdk.Worker.Quartz/Milvasoft.Milvaion.Sdk.Worker.Quartz.csproj

      - name: Build Milvasoft.Milvaion.Sdk.Worker.Quartz
        run: dotnet build src/Sdk/Milvasoft.Milvaion.Sdk.Worker.Quartz/Milvasoft.Milvaion.Sdk.Worker.Quartz.csproj --no-restore --configuration Release

      - name: Pack Milvasoft.Milvaion.Sdk.Worker.Quartz
        run: dotnet pack src/Sdk/Milvasoft.Milvaion.Sdk.Worker.Quartz/Milvasoft.Milvaion.Sdk.Worker.Quartz.csproj --no-build --configuration Release --include-symbols -p:SymbolPackageFormat=snupkg -o ./packages

