name: Node SDK - Build & Test

on:
  push:
    branches: [ master, develop ]
    paths:
      - 'sdks/node/**'
      - '.github/workflows/node-sdk.yml'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'sdks/node/**'
      - '.github/workflows/node-sdk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Tests run TypeScript directly, which needs Node 22.6 or later.
        node: [ '22', '24' ]

    defaults:
      run:
        working-directory: sdks/node/milvaion-worker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdks/node/milvaion-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Load the built package
        run: node -e "import('./dist/index.js').then(m => { if (!m.MilvaionWorker) process.exit(1) })"
