name: CI - Build & Test

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: |
          dotnet restore src/Milvaion.Api/Milvaion.Api.csproj
          dotnet restore tests/Milvaion.UnitTests/Milvaion.UnitTests.csproj
          dotnet restore tests/Milvaion.IntegrationTests/Milvaion.IntegrationTests.csproj

      - name: Build projects
        run: |
          dotnet build src/Milvaion.Api/Milvaion.Api.csproj --no-restore --configuration Release
          dotnet build tests/Milvaion.UnitTests/Milvaion.UnitTests.csproj --no-restore --configuration Release
          dotnet build tests/Milvaion.IntegrationTests/Milvaion.IntegrationTests.csproj --no-restore --configuration Release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            **/bin/Release
            !**/node_modules/**
          retention-days: 1

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: |
          dotnet restore tests/Milvaion.UnitTests/Milvaion.UnitTests.csproj
          dotnet restore tests/SampleWorker.Tests/SampleWorker.Tests.csproj

      - name: Run Unit Tests
        run: dotnet test tests/Milvaion.UnitTests/Milvaion.UnitTests.csproj --no-restore --configuration Release --logger "trx;LogFileName=unit-test-results.trx" --collect:"XPlat Code Coverage" --settings tests/coverage.runsettings --results-directory ./TestResults

      - name: Run SampleWorker Tests
        run: dotnet test tests/SampleWorker.Tests/SampleWorker.Tests.csproj --no-restore --configuration Release --logger "trx;LogFileName=sample-worker-test-results.trx" --results-directory ./TestResults

      - name: Upload Unit Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: ./TestResults
          retention-days: 30

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: Unit Test Results
          path: ./TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: true

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore tests/Milvaion.IntegrationTests/Milvaion.IntegrationTests.csproj

      - name: Run Integration Tests
        run: dotnet test tests/Milvaion.IntegrationTests/Milvaion.IntegrationTests.csproj --no-restore --configuration Release --logger "trx;LogFileName=integration-test-results.trx" --collect:"XPlat Code Coverage" --settings tests/coverage.runsettings --results-directory ./TestResults

      - name: Upload Integration Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: ./TestResults
          retention-days: 30

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: Integration Test Results
          path: ./TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: true

  ui:
    name: UI Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/MilvaionUI

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/MilvaionUI/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Reported but not blocking: a style problem must not hold back a publish, which waits on this workflow.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Unit Test Results
        uses: actions/download-artifact@v4
        with:
          name: unit-test-results
          path: ./TestResults/Unit

      - name: Download Integration Test Results
        uses: actions/download-artifact@v4
        with:
          name: integration-test-results
          path: ./TestResults/Integration

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./TestResults
          fail_ci_if_error: false
          verbose: true
