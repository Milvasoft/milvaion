name: CLI - Release

# Push a tag like cli-v1.2.3 to publish milvaion CLI binaries for Linux, macOS
# and Windows (amd64 and arm64) to a GitHub release of that tag.
on:
  push:
    tags: [ 'cli-v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/milvaion-cli/go.mod
          cache-dependency-path: tools/milvaion-cli/go.sum

      - name: Version from tag
        id: version
        run: |
          v="${GITHUB_REF_NAME#cli-v}"
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must look like cli-v1.2.3, got $GITHUB_REF_NAME"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Test
        working-directory: tools/milvaion-cli
        run: go test -count=1 ./...

      # The repository carries several kinds of release tags, so GoReleaser is
      # given the plain semver and does not publish; the next step uploads dist/.
      - name: Build with GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          workdir: tools/milvaion-cli
          args: release --clean --skip=validate
        env:
          GORELEASER_CURRENT_TAG: v${{ steps.version.outputs.version }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: milvaion CLI ${{ steps.version.outputs.version }}
          body: |
            Download the archive for your platform, extract `milvaion` and put it on your PATH.
            Verify the download against `milvaion_${{ steps.version.outputs.version }}_checksums.txt`.

            See https://github.com/${{ github.repository }}/blob/master/docs/portaldocs/29-jobs-as-code.md
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          # Keep the server release as the repository's "latest".
          make_latest: false
          files: |
            tools/milvaion-cli/dist/*.tar.gz
            tools/milvaion-cli/dist/*.zip
            tools/milvaion-cli/dist/*_checksums.txt
