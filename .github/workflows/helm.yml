name: Helm Chart

on:
  push:
    branches: [ master, develop ]
    paths:
      - 'deploy/helm/**'
      - '.github/workflows/helm.yml'
    tags:
      - 'helm-v*'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'deploy/helm/**'
      - '.github/workflows/helm.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CHART_DIR: deploy/helm/milvaion
  HELM_VERSION: v3.16.3
  KUBECONFORM_VERSION: v0.6.7

jobs:
  lint:
    name: Lint and template
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform

      # The default values point at no database on purpose, so lint runs once per CI values file.
      - name: helm lint
        run: |
          helm lint "$CHART_DIR"
          for values in "$CHART_DIR"/ci/*-values.yaml; do
            echo "::group::helm lint --strict -f $values"
            helm lint "$CHART_DIR" --strict -f "$values"
            echo "::endgroup::"
          done

      - name: helm template and validate against the Kubernetes schemas
        run: |
          for values in "$CHART_DIR"/ci/*-values.yaml; do
            echo "::group::helm template -f $values"
            helm template milvaion "$CHART_DIR" --namespace milvaion -f "$values" \
              | kubeconform -strict -summary -kubernetes-version 1.29.0 \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done

      - name: Missing dependencies fail with a clear message
        run: |
          if helm template milvaion "$CHART_DIR" > /dev/null 2> err.txt; then
            echo "Expected the default values to require externalDatabase.host"; exit 1
          fi
          grep -q "externalDatabase.host" err.txt

  publish:
    name: Publish chart to GHCR
    needs: lint
    if: startsWith(github.ref, 'refs/tags/helm-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Check that the tag matches Chart.yaml
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#helm-v}"
          chart_version="$(grep '^version:' "$CHART_DIR/Chart.yaml" | awk '{print $2}')"
          if [ "$tag_version" != "$chart_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Chart.yaml version $chart_version"; exit 1
          fi
          echo "version=$chart_version" >> "$GITHUB_OUTPUT"

      - name: Package chart
        run: helm package "$CHART_DIR" --destination dist

      - name: Push to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "dist/milvaion-${{ steps.version.outputs.version }}.tgz" "oci://ghcr.io/${owner}/charts"

      - name: Attach the package to a GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/milvaion-${{ steps.version.outputs.version }}.tgz" \
            --title "Helm chart ${{ steps.version.outputs.version }}" \
            --notes "Install with: helm install milvaion oci://ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/charts/milvaion --version ${{ steps.version.outputs.version }}"
