[package]
name = "milvaion-worker"
version = "1.1.0"
edition = "2021"
rust-version = "1.89"
description = "Worker SDK for Milvaion, the distributed job scheduler: run Milvaion jobs in Rust."
license = "Apache-2.0"
repository = "https://github.com/Milvasoft/milvaion"
homepage = "https://github.com/Milvasoft/milvaion/tree/master/sdks/rust/milvaion-worker"
documentation = "https://docs.rs/milvaion-worker"
readme = "README.md"
keywords = ["milvaion", "job-scheduler", "worker", "rabbitmq", "background-jobs"]
categories = ["asynchronous", "network-programming"]
include = ["src/**/*", "examples/**/*", "build.rs", "Cargo.toml", "README.md"]

[features]
default = ["rustls"]
# TLS for amqps:// URLs.
rustls = ["lapin/rustls--ring", "lapin/rustls-native-certs"]
# The optional Apache Kafka transport. Builds librdkafka from source (needs CMake and a C compiler),
# with a vendored OpenSSL for TLS and SASL/SCRAM.
kafka = ["dep:rdkafka"]

[dependencies]
lapin = { version = "4.12", default-features = false, features = ["tokio"] }
redis = { version = "1.8", default-features = false, features = ["tokio-comp"] }
tokio = { version = "1.40", features = ["rt", "macros", "sync", "time", "signal", "net"] }
tokio-util = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
rdkafka = { version = "0.39", optional = true, default-features = false, features = [
    "tokio",
    "cmake-build",
    "ssl-vendored",
    "libz-static",
    # librdkafka 2.12 includes curl/curl.h in every CMake build (an #ifdef on a 0/1 define), so
    # build curl from source too rather than require the system's libcurl headers.
    "curl-static",
    "tracing",
] }

[dev-dependencies]
tokio = { version = "1.40", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "basic"
path = "examples/basic.rs"
