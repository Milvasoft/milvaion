{{- include "milvaion.validate" . -}}
{{- $data := dict -}}
{{- if not .Values.auth.existingSecret -}}
{{- $_ := set $data .Values.auth.secretKeys.jwtSigningKey (include "milvaion.secretValue" (dict "root" $ "key" .Values.auth.secretKeys.jwtSigningKey "value" .Values.auth.jwtSigningKey "length" 64)) -}}
{{- $_ := set $data .Values.auth.secretKeys.apiKeySecret (include "milvaion.secretValue" (dict "root" $ "key" .Values.auth.secretKeys.apiKeySecret "value" .Values.auth.apiKeySecret "length" 64)) -}}
{{- $_ := set $data .Values.auth.secretKeys.rootPassword (include "milvaion.secretValue" (dict "root" $ "key" .Values.auth.secretKeys.rootPassword "value" .Values.auth.rootPassword "length" 24)) -}}
{{- end -}}
{{- if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) -}}
{{- $_ := set $data .Values.externalDatabase.existingSecretPasswordKey (required "Set externalDatabase.password or externalDatabase.existingSecret." .Values.externalDatabase.password) -}}
{{- end -}}
{{- if and (include "milvaion.usesKafka" .) (include "milvaion.kafka.sasl" .) (not .Values.kafka.existingSecret) -}}
{{- $_ := set $data .Values.kafka.existingSecretPasswordKey (required "Set kafka.password or kafka.existingSecret." .Values.kafka.password) -}}
{{- end -}}
{{- if and (not (include "milvaion.usesKafka" .)) (not .Values.rabbitmq.enabled) (not .Values.externalRabbitmq.existingSecret) -}}
{{- $_ := set $data .Values.externalRabbitmq.existingSecretPasswordKey (required "Set externalRabbitmq.password or externalRabbitmq.existingSecret." .Values.externalRabbitmq.password) -}}
{{- end -}}
{{- if and (not .Values.redis.enabled) (not .Values.externalRedis.existingSecret) .Values.externalRedis.password -}}
{{- $_ := set $data .Values.externalRedis.existingSecretPasswordKey .Values.externalRedis.password -}}
{{- end -}}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "milvaion.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "milvaion.labels" . | nindent 4 }}
  annotations:
    # Generated keys must outlive an uninstall: a new JWT key logs everyone out, a new API key secret
    # invalidates every issued key.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v | b64enc | quote }}
  {{- end }}
{{- end }}
