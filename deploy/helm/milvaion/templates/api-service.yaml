apiVersion: v1
kind: Service
metadata:
  name: {{ include "milvaion.api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "milvaion.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  {{- with .Values.api.service.sessionAffinity }}
  sessionAffinity: {{ . }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (has .Values.api.service.type (list "NodePort" "LoadBalancer")) .Values.api.service.nodePort }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
  selector:
    {{- include "milvaion.api.selectorLabels" . | nindent 4 }}
