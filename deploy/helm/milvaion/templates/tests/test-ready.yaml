apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-test-ready" (include "milvaion.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "milvaion.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: ready
      image: {{ .Values.tests.image }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      # The readiness endpoint answers 200 only when PostgreSQL, Redis and RabbitMQ are all reachable.
      command:
        - curl
        - --fail
        - --silent
        - --show-error
        - --retry
        - "10"
        - --retry-delay
        - "5"
        - --retry-all-errors
        - {{ printf "http://%s:%v%s" (include "milvaion.api.fullname" .) .Values.api.service.port .Values.api.readinessProbe.path }}
